<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tajemství světla — digitální kniha</title>
<style>
:root{--bg:#f5f1e8;--paper:#fffdf8;--text:#25231f;--muted:#777066;--accent:#8b5e34;--border:#e4dbcd}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Georgia,"Times New Roman",serif}
header{padding:26px 20px;text-align:center;background:linear-gradient(135deg,#30271f,#725438);color:white}
header small{letter-spacing:3px;text-transform:uppercase;opacity:.75}
header h1{font-size:clamp(32px,6vw,62px);margin:12px 0 6px;font-weight:500}
header p{margin:0;color:#e9dfd3;font-family:Arial,sans-serif}
.app{max-width:1100px;margin:28px auto;padding:0 18px;display:grid;grid-template-columns:250px minmax(0,720px);gap:24px}
nav,.book{background:var(--paper);border:1px solid var(--border);border-radius:18px;box-shadow:0 12px 35px #4d382015}
nav{padding:18px;height:max-content;position:sticky;top:18px}
nav h3{margin:4px 8px 15px;font-family:Arial,sans-serif}
.chapter-btn{width:100%;border:0;background:transparent;text-align:left;padding:11px 10px;border-radius:10px;cursor:pointer;color:var(--text);font-family:Arial,sans-serif}
.chapter-btn:hover,.chapter-btn.active{background:#efe6d9;color:var(--accent)}
.book{padding:clamp(28px,5vw,62px)}
.meta{font-family:Arial,sans-serif;color:var(--muted);font-size:14px;margin-bottom:28px}
h2{font-size:clamp(28px,5vw,42px);font-weight:500;margin:0 0 24px}
p{font-size:19px;line-height:1.85;margin:0 0 19px}
.dropcap:first-letter{font-size:3.4em;float:left;line-height:.8;padding:7px 9px 0 0;color:var(--accent)}
.controls{display:flex;justify-content:space-between;gap:10px;margin-top:38px;padding-top:22px;border-top:1px solid var(--border)}
button.control{border:1px solid var(--border);background:white;border-radius:10px;padding:11px 16px;cursor:pointer;font-family:Arial,sans-serif}
button.control:hover{border-color:var(--accent)}
.progress{height:5px;background:#e9e1d6;border-radius:5px;margin:12px 0 0;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);width:0}
.settings{display:flex;gap:8px;margin-top:15px}
@media(max-width:800px){.app{grid-template-columns:1fr}nav{position:static}.chapter-list{display:grid;grid-template-columns:1fr 1fr}.book{padding:28px 22px}p{font-size:18px}}
@media(max-width:480px){.chapter-list{grid-template-columns:1fr}}
.dark{--bg:#171513;--paper:#211e1b;--text:#eee7dd;--muted:#aaa097;--border:#3a342e;--accent:#d7a46a}.dark header{background:linear-gradient(135deg,#0e0d0c,#30251b)}.dark .chapter-btn:hover,.dark .chapter-btn.active{background:#332b23}.dark button.control{background:#292521;color:var(--text)}
</style>
</head>
<body>
<header>
<small>Digitální román</small>
<h1>Tajemství světla</h1>
<p>Krátký příběh o městě, které mělo jednu noc zmizet.</p>
</header>

<div class="app">
<nav>
<h3>Obsah</h3>
<div id="chapters" class="chapter-list"></div>
<div class="settings">
<button class="control" onclick="toggleDark()">◐ Režim</button>
<button class="control" onclick="changeFont(1)">A+</button>
<button class="control" onclick="changeFont(-1)">A−</button>
</div>
</nav>

<main class="book">
<div class="meta" id="meta"></div>
<h2 id="title"></h2>
<div id="text"></div>
<div class="controls">
<button class="control" onclick="prev()">← Předchozí</button>
<button class="control" onclick="next()">Další →</button>
</div>
<div class="progress"><i id="bar"></i></div>
</main>
</div>

<script>
const chapters=[
["Prolog","Když zhasly hodiny",`Ve městě Lumen nikdy nebyla úplná tma. Dokonce i o půlnoci svítily lampy na náměstí a modré světlo z věže odráželo mraky nad střechami. Lidé říkali, že právě díky tomu je Lumen bezpečné místo.

Sedmnáctiletý Adam tomu nikdy moc nevěřil. Bydlel v ulici pod starou hodinovou věží a každou noc slyšel její tikání. Jenže jednoho říjnového večera tikání náhle přestalo.

Adam vyšel k oknu. Věž ukazovala 23:17.

A pak zhaslo celé město.`],
["Kapitola 1","Světlo v lese",`Ráno bylo všechno zase normální. Lampy svítily, obchody otevřely a lidé se tvářili, jako by se nic nestalo. Adam se ale nemohl zbavit pocitu, že včerejší noc nebyla sen.

Ve škole našel pod lavicí malý kovový přívěsek. Byl na něm vyrytý symbol kruhu rozděleného jedinou čárou.

Po vyučování se vydal za město. Symbol znal. Stejný byl na kameni, kolem kterého chodíval děda do lesa.

Když tam dorazil, mezi stromy uviděl slabé zlaté světlo.

Nebyl si jistý, jestli se má přiblížit.

Přiblížil se.`],
["Kapitola 2","Dveře pod kamenem",`Světlo vycházelo z úzké škvíry pod obrovským kamenem. Adam se dotkl přívěsku a kámen se tiše posunul.

Pod ním byly schody.

„Tohle tu včera určitě nebylo,“ zašeptal.

Sešel dolů. Chodba vedla hluboko pod zem a na stěnách byly stovky stejných symbolů. Na konci čekaly železné dveře.

Tentokrát se přívěsek rozsvítil sám.

Dveře se otevřely.

Za nimi nebyla místnost, ale celé podzemní město. Domy, mosty a uprostřed obrovské hodiny, které místo ručiček měly jediný paprsek světla.

A někdo tam čekal.`],
["Kapitola 3","Poslední strážce",`„Čekali jsme na tebe,“ řekl muž v dlouhém šedém kabátu.

Adam ustoupil. „Na mě? Proč?“

Muž ukázal na přívěsek. „Protože světlo si vždycky vybere člověka, který dokáže vidět to, co ostatní přehlížejí.“

Adam se dozvěděl, že Lumen stojí nad starým městem, které kdysi chránilo světelný mechanismus. Ten dokázal udržovat světlo nad celým krajem. Jenže mechanismus slábl.

„Včera v noci se zastavil poprvé,“ řekl strážce. „A pokud se zastaví znovu, tentokrát se světlo nevrátí.“

Adam pohlédl na obrovské hodiny.

Paprsek světla začal pomalu mizet.`],
["Kapitola 4","23:17",`Ve městě nahoře se právě blížila 23:17.

Adam pochopil, že má jen několik minut.

Spolu se strážcem doběhl k hodinám. Na jejich podstavci našel místo přesně pro svůj přívěsek.

Zasunul ho dovnitř.

Nic se nestalo.

„Musíš si vybrat,“ řekl strážce. „Světlo se nedá zapnout silou.“

Adam zavřel oči. Myslel na všechno, co mu na Lumenu připadalo obyčejné: ranní cestu do školy, světla v oknech, zvuk tramvaje, smích lidí na náměstí.

Pak pochopil.

Světlo nebylo v hodinách.

Bylo v lidech.

Položil ruku na kovový kruh.

A celé podzemní město se rozzářilo.`],
["Epilog","Ráno po tmě",`Ve 23:17 se hodiny znovu rozběhly.

Lumen nezmizelo.

Ráno nikdo nevěděl, co se stalo. Lidé jen říkali, že světla byla v noci nezvykle jasná.

Adam se vydal do školy. Přívěsek měl pořád u sebe, ale už nesvítil.

U hodinové věže se zastavil.

Na okamžik zaslechl známé tikání.

Tentokrát však mezi jednotlivými údery uslyšel ještě něco.

Tiché zaklepání.

Adam se otočil.

Na druhé straně náměstí stál někdo, koho nikdy předtím neviděl.

A v ruce držel stejný přívěsek.

Konec… nebo začátek dalšího příběhu?`]
];

let index=Number(localStorage.bookChapter||0), font=Number(localStorage.bookFont||19);
const chaptersEl=document.getElementById("chapters");
chapters.forEach((c,i)=>{let b=document.createElement("button");b.className="chapter-btn";b.textContent=c[1];b.onclick=()=>show(i);chaptersEl.appendChild(b)});
function show(i){
 index=Math.max(0,Math.min(chapters.length-1,i)); localStorage.bookChapter=index;
 const c=chapters[index]; document.getElementById("meta").textContent=`${c[0]}  •  ${index+1} / ${chapters.length}`;
 document.getElementById("title").textContent=c[1];
 document.getElementById("text").innerHTML=c[2].split("\n\n").map((p,j)=>`<p class="${j===0?'dropcap':''}">${p}</p>`).join("");
 document.querySelectorAll(".chapter-btn").forEach((b,j)=>b.classList.toggle("active",j===index));
 document.getElementById("bar").style.width=((index+1)/chapters.length*100)+"%";
 window.scrollTo({top:0,behavior:"smooth"});
}
function next(){show(index+1)}
function prev(){show(index-1)}
function toggleDark(){document.body.classList.toggle("dark");localStorage.dark=document.body.classList.contains("dark")}
function changeFont(n){font=Math.max(15,Math.min(25,font+n));localStorage.bookFont=font;document.querySelectorAll("#text p").forEach(p=>p.style.fontSize=font+"px")}
if(localStorage.dark==="true")document.body.classList.add("dark");
show(index);
</script>
</body>
</html>
